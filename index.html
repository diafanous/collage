<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>collage</title>
<style>
@font-face{font-family:"Paper Mono";font-weight:400;src:url(/font/Regular.woff2) format("woff2")}
@font-face{font-family:"Paper Mono";font-weight:500;src:url(/font/Medium.woff2) format("woff2")}
:root{--bg:#0c0c0d;--panel:#101012;--stage:#09090a;--line:#242428;--fg:#ececea;--dim:#86868c}
@media (prefers-color-scheme:light){:root{--bg:#f4f3ef;--panel:#faf9f6;--stage:#e9e8e3;--line:#dedcd5;--fg:#18181b;--dim:#7a7a80}}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:12px/1.5 "Paper Mono",ui-monospace,Consolas,monospace;display:grid;grid-template-columns:1fr 340px;overflow:hidden}
body.drag #stage{outline:1px dashed var(--fg);outline-offset:-14px}

#stage{position:relative;display:grid;place-items:center;background:var(--stage);min-width:0;min-height:0;overflow:hidden}
#frame{position:relative;box-shadow:0 0 0 1px var(--line),0 30px 80px -30px #000a}
#view{display:block;width:100%;height:100%}
#ink{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;touch-action:none}
#ink.on{pointer-events:auto;cursor:crosshair}
#empty{text-align:center;color:var(--dim);line-height:2}
#toast{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:6px 12px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:80%}
#toast.on{opacity:1}

aside{background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:0 22px 24px}
header{display:flex;align-items:center;gap:12px;height:52px;font-weight:500}
header #ms{margin-left:auto;color:var(--dim);font-weight:400}
section{border-top:1px solid var(--line);padding:16px 0 6px}
h2{font:inherit;color:var(--dim);display:flex;justify-content:space-between;margin-bottom:12px}
h2 em{font-style:normal}

button{all:unset;cursor:pointer;color:var(--dim)}
button:hover:not(:disabled){color:var(--fg)}
:focus-visible{outline:1px solid var(--fg);outline-offset:2px}
input,select{background:transparent;color:inherit;font:inherit;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:1px 0;outline:0;min-width:0}
input:focus,select:focus{border-color:var(--fg)}
select{padding-right:2px;cursor:pointer}
select option{background:var(--panel)}
input[type=number]{width:62px;text-align:right;appearance:textfield;-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button{display:none}
input[type=color]{width:18px;height:18px;padding:0;border:1px solid var(--dim);cursor:pointer;appearance:none;-webkit-appearance:none}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}
input[type=color]::-webkit-color-swatch{border:0}
input[type=color]::-moz-color-swatch{border:0}

.sl{display:grid;grid-template-columns:1fr auto;row-gap:5px;margin-bottom:14px}
.sl span{color:var(--dim)}
.sl .val{width:64px;text-align:right}
.sl input[type=range]{grid-column:1/-1}
input[type=range]{appearance:none;-webkit-appearance:none;height:14px;border:0;padding:0;background:transparent;cursor:pointer;--p:0%}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:linear-gradient(to right,var(--fg) var(--p),var(--line) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;margin-top:-4px;border-radius:50%;border:0;background:var(--fg)}
input[type=range]::-moz-range-track{height:2px;background:var(--line)}
input[type=range]::-moz-range-progress{height:2px;background:var(--fg)}
input[type=range]::-moz-range-thumb{width:10px;height:10px;border:0;border-radius:50%;background:var(--fg)}
.row input[type=range]{width:96px}
.row input[type=checkbox]{accent-color:var(--fg);width:12px;height:12px;margin:0;cursor:pointer}
.row label{display:flex;align-items:center;gap:8px;color:var(--dim);cursor:pointer}
.row label:has(:disabled){opacity:.4;cursor:default}
#fpath{flex:1;text-align:left}
#fn{width:40px}
#curve{display:block;width:220px;height:220px;margin:0 auto 10px;border:1px solid var(--line);touch-action:none;cursor:crosshair}
.note{color:var(--dim);margin:-6px 0 14px}
button.tgl.on{color:var(--fg);box-shadow:0 1px 0 var(--fg)}

.row{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.row .grow{flex:1}
.row > span{color:var(--dim)}
.file{margin-bottom:14px}
.file .nm{display:flex;justify-content:space-between;gap:8px}
.file .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file .row{margin:4px 0 0}
.file input[type=number]{width:56px;text-align:left}
.file .tag{color:var(--dim);margin-top:2px}
.file .tag.warn{color:var(--fg)}
.file .tag.warn::before{content:"! "}
.seg{display:flex;gap:14px}
.seg button.on{color:var(--fg);box-shadow:0 1px 0 var(--fg)}
#go{display:block;text-align:center;border:1px solid var(--fg);color:var(--fg);padding:9px 0;margin:6px 0 12px}
#go:hover:not(:disabled){background:var(--fg);color:var(--bg)}
#go:disabled{opacity:.4;cursor:progress}
#px{color:var(--dim);margin-bottom:14px}
#px.warn{color:var(--fg)}
@media (max-width:760px){body{grid-template-columns:1fr;grid-template-rows:55vh 1fr}aside{border-left:0;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<main id="stage">
  <div id="frame" hidden><img id="view" alt="collage preview"><canvas id="ink" aria-label="drawing layer"></canvas></div>
  <div id="empty">drop images or pdfs<br><button id="open">or choose files</button></div>
  <div id="toast" role="status"></div>
</main>
<aside>
  <header>collage <span id="ms"></span>
    <select id="unit" aria-label="units"><option>in</option><option>cm</option><option>mm</option></select>
  </header>
  <section>
    <h2>source</h2>
    <div id="files"></div>
    <div class="row"><button id="add">+ add image / pdf</button></div>
    <div class="row"><input id="fpath" placeholder="random from folder: paste its path" aria-label="folder path"><input id="fn" type="number" min="1" max="50" value="3" title="how many files" aria-label="how many files"><button id="fgo">pick</button></div>
    <input id="pick" type="file" multiple accept="image/*,.pdf,application/pdf" hidden>
  </section>
  <section><h2>cut <em id="cutinfo"></em></h2><div id="sl-cut"></div>
    <div class="row"><span class="grow">section size</span><input id="cwv" type="number" step="any" aria-label="section width"><span>×</span><input id="chv" type="number" step="any" aria-label="section height"><span id="cu"></span></div>
  </section>
  <section><h2>collage</h2><div id="sl-collage"></div></section>
  <section>
    <h2>guides</h2><div id="sl-guides"></div>
    <div class="row"><button class="tgl" id="inkbtn" title="draw on the preview: sections drift toward your lines">✎ draw on preview</button><span class="grow"></span><button id="inkclear">clear</button></div>
  </section>
  <section>
    <h2>tone</h2><div id="sl-tone"></div>
    <canvas id="curve" width="440" height="440" aria-label="tone curve: click to add a point, drag to move, double-click a point to remove"></canvas>
    <div class="row"><span class="grow">curve</span><button id="curvereset">reset</button></div>
  </section>
  <section>
    <h2>layers</h2><div id="sl-layers"></div>
    <div class="row"><span>seed</span><button id="seed">↻ <span id="seedn"></span></button><span class="grow"></span><span>paper</span><input id="bg" type="color" aria-label="background colour"></div>
  </section>
  <section>
    <h2>output</h2>
    <div class="row"><span class="grow">size</span><input id="ow" type="number" step="any" aria-label="output width"><span>×</span><input id="oh" type="number" step="any" aria-label="output height"><span id="ou"></span></div>
    <div class="row"><span class="grow">dpi</span><input id="dpi" type="number" min="10" max="1200" list="dpis" aria-label="dpi"><datalist id="dpis"><option>72<option>150<option>300<option>600<option>1200</datalist></div>
    <div class="row"><span class="grow">file</span><div class="seg" id="fmt"><button data-f="png" class="on">png</button><button data-f="tif">tif</button><button data-f="pdf">pdf</button><button data-f="map" title="vector pdf of how every section moved">map</button></div></div>
    <div class="row"><label><input id="lines" type="checkbox"><span>also save portion linework</span></label></div>
    <div id="mapsec" hidden>
      <div class="row"><span class="grow">initial</span><input type="color" id="m1c" aria-label="initial tone"><input type="range" id="m1o" min="0" max="1" step=".01" aria-label="initial opacity"></div>
      <div class="row"><span class="grow">migration</span><input type="color" id="m2c" aria-label="migration tone"><input type="range" id="m2o" min="0" max="1" step=".01" aria-label="migration opacity"></div>
      <div class="row"><span class="grow">final</span><input type="color" id="m3c" aria-label="final tone"><input type="range" id="m3o" min="0" max="1" step=".01" aria-label="final opacity"></div>
      <div class="row"><span class="grow">paper</span><input type="color" id="mp" aria-label="map paper colour"></div>
      <div class="note">vector pdf. layers: paper, initial, migration, final. switch them in your pdf viewer.</div>
    </div>
    <div id="px"></div>
    <button id="go"></button>
  </section>
</aside>
<script>
const $ = s => document.querySelector(s), UN = {in: 1, cm: 2.54, mm: 25.4};
const pc = v => Math.round(v * 100) + '%'; pc.pct = true;                      // .pct: typed 25 means 25%
const sg = v => (v > 0 ? '+' : '') + Math.round(v * 100) + '%'; sg.pct = true;
// [key, label, min, max, step, default, format]
const SL = {
  cut: [['cw', 'width', .05, 1, .01, .25, pc], ['ch', 'height', .05, 1, .01, .25, pc],
        ['ps', 'portion of each file', .1, 1, .01, 1, pc], ['pn', 'portions per file', 1, 6, 1, 2, v => v]],
  collage: [['scale', 'scale', .1, 4, .01, 1, v => v.toFixed(2) + '×'], ['var', 'size variance', 0, .9, .01, .25, pc],
            ['rot', 'rotation', 0, 180, 1, 12, v => v + '°'], ['scatter', 'scatter', 0, 1, .01, .35, pc], ['density', 'density', .1, 1, .01, 1, pc],
            ['blur', 'edge blur', 0, 1, .01, 0, pc]],
  guides: [['gs', 'grid pull', 0, 1, .01, 0, pc], ['gn', 'grid size', 2, 24, 1, 8, v => v], ['gi', 'grid irregularity', 0, 1, .01, 0, pc],
           ['draw', 'drawing pull', 0, 1, .01, .7, pc]],
  tone: [['con', 'contrast', -1, 1, .01, 0, sg], ['lb', 'black point', 0, 254, 1, 0, v => v], ['lw', 'white point', 1, 255, 1, 255, v => v],
         ['lg', 'gamma', .2, 5, .01, 1, v => v.toFixed(2)]],
  layers: [['layers', 'layers', 1, 8, 1, 2, v => v], ['opacity', 'opacity', .05, 1, .01, 1, pc]],
};
const P = {}, SLIDER = {}, st = {files: [], w: 0, h: 0, touched: false, dpi: 300, fmt: 'png', bg: '#f4f2ee', unit: 'in', seed: 1,
  map: {m1c: '#8a8a90', m1o: .8, m2c: '#ff5a36', m2o: .8, m3c: '#18181b', m3o: 1, mp: '#f4f2ee'}};   // migration map: tone/opacity per layer, paper
const show = v => +(v * UN[st.unit]).toFixed(st.unit === 'mm' ? 1 : 2);
const toIn = v => v / UN[st.unit];

let tt;
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 5000); }

// ---- sliders
for (const [sec, list] of Object.entries(SL)) for (const [k, label, min, max, step, def, f] of list) {
  const l = document.createElement('div');
  l.className = 'sl'; l.title = 'double-click to reset; click the value to type one';
  l.innerHTML = `<span>${label}</span><input class="val" aria-label="${label} value"><input type="range" aria-label="${label}" min="${min}" max="${max}" step="${step}" value="${def}">`;
  const r = l.querySelector('[type=range]'), o = l.querySelector('.val');
  const set = () => { o.value = f(+r.value); r.style.setProperty('--p', (r.value - min) / (max - min) * 100 + '%'); P[k] = +r.value; };
  r.oninput = () => { set(); info(); draw(true); };
  r.onchange = () => draw(false);
  l.ondblclick = () => { r.value = def; set(); info(); draw(false); };
  o.onfocus = () => o.select();
  o.onchange = () => {   // typed value: percent fields take 25 for 25%, out-of-range values are clamped
    let v = parseFloat(o.value.replace(',', '.'));
    if (!isNaN(v)) { r.value = Math.min(max, Math.max(min, f.pct ? v / 100 : v)); P[k] = +r.value; }
    set(); info(); draw(false);
  };
  SLIDER[k] = {r, set};
  set(); $('#sl-' + sec).append(l);
}

// typed physical section size (in the chosen unit) -> the cut slider that produces it
for (const [id, k, side] of [['#cwv', 'cw', f => f.w], ['#chv', 'ch', f => f.w * f.aspect]]) {
  $(id).oninput = () => {
    const f = st.files[0], v = toIn(+$(id).value);
    if (!f || !(v > 0)) return;
    SLIDER[k].r.value = Math.min(1, Math.max(.05, v / side(f)));
    SLIDER[k].set(); info(id); draw(false);
  };
}

function info(keep) {   // keep: id of the field being typed in, so it isn't rewritten under the cursor
  const f = st.files[0], c = Math.max(1, Math.round(1 / P.cw)), r = Math.max(1, Math.round(1 / P.ch));
  $('#cutinfo').textContent = `${c}×${r}`; $('#cu').textContent = st.unit;
  if (keep !== '#cwv') $('#cwv').value = f ? show(f.w / c) : '';
  if (keep !== '#chv') $('#chv').value = f ? show(f.w * f.aspect / r) : '';
  outUI();
}

// ---- sources
const esc = s => s.replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
function files() {
  $('#files').replaceChildren();
  st.files.forEach((f, i) => {
    const d = document.createElement('div');
    d.className = 'file';
    d.innerHTML = `<div class="nm"><span title="${esc(f.name)}">${esc(f.name)}</span><button title="remove">×</button></div>
      <div class="row"><input type="number" step="any" min="0.1" aria-label="source width" value="${show(f.w)}"><span>× <b class="h">${show(f.w * f.aspect)}</b> ${st.unit}</span>
      ${f.pdf ? `<span class="grow"></span><span>page</span><input type="number" min="1" max="${f.pages}" value="${f.page}" aria-label="page"><span>/ ${f.pages}</span>` : ''}</div>
      <div class="tag ${f.assumed && !f.edited ? 'warn' : ''}">${f.edited ? 'size set by you' : f.assumed ? 'no dpi in file, assumed 300 dpi' : f.pdf ? 'size from pdf' : 'size from file'}</div>`;
    const [w, pg] = d.querySelectorAll('input');
    w.oninput = () => { if (!(+w.value > 0)) return; f.w = toIn(+w.value); f.edited = true; d.querySelector('.h').textContent = show(f.w * f.aspect); d.querySelector('.tag').textContent = 'size set by you'; d.querySelector('.tag').className = 'tag'; syncOut(); info(); draw(false); };
    if (pg) pg.oninput = () => { f.page = Math.min(Math.max(+pg.value | 0, 1), f.pages); draw(false); };
    d.querySelector('button').onclick = () => { fetch('/source/' + f.id, {method: 'DELETE'}); st.files.splice(i, 1); after(); };
    $('#files').append(d);
  });
}

async function add(list) {
  for (const f of list) {
    const r = await fetch('/source', {method: 'POST', headers: {'X-Name': encodeURIComponent(f.name)}, body: f});
    const j = await r.json();
    if (r.ok) st.files.push({...j, page: 1, edited: false}); else toast(j.error);
  }
  after();
}
function after() {
  $('#empty').hidden = st.files.length > 0; $('#frame').hidden = !st.files.length;
  syncOut(); files(); info(); draw(false);
}
$('#add').onclick = $('#open').onclick = () => $('#pick').click();
$('#pick').onchange = e => { add([...e.target.files]); e.target.value = ''; };
addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('drag'); });
addEventListener('dragleave', e => { if (!e.relatedTarget) document.body.classList.remove('drag'); });
addEventListener('drop', e => { e.preventDefault(); document.body.classList.remove('drag'); add([...e.dataTransfer.files]); });

// ---- output
function syncOut() {
  const f = st.files[0];
  if (f && !st.touched) { st.w = f.w; st.h = f.w * f.aspect; }
  outUI();
}
function outUI() {
  $('#ow').value = st.w ? show(st.w) : ''; $('#oh').value = st.h ? show(st.h) : ''; $('#ou').textContent = st.unit;
  const w = Math.round(st.w * st.dpi), h = Math.round(st.h * st.dpi), big = w * h > 4e8;
  const map = st.fmt === 'map', lines = $('#lines');
  $('#px').textContent = !st.w ? '' : map ? `vector · ${show(st.w)} × ${show(st.h)} ${st.unit}`
    : `${w} × ${h} px · ${(w * h / 1e6).toFixed(1)} MP${big ? ' · over the 400 MP limit' : ''}`;
  $('#px').classList.toggle('warn', big && !map);
  lines.disabled = !(P.ps < .999);   // linework only exists when portions are in play
  if (lines.disabled) lines.checked = false;
  $('#go').textContent = 'export ' + st.fmt + (lines.checked ? ' + linework' : '');
}
$('#lines').onchange = outUI;
$('#ow').oninput = () => { if (+$('#ow').value > 0) { st.w = toIn(+$('#ow').value); st.touched = true; outUI(); draw(false); } };
$('#oh').oninput = () => { if (+$('#oh').value > 0) { st.h = toIn(+$('#oh').value); st.touched = true; outUI(); draw(false); } };
$('#dpi').oninput = () => { if (+$('#dpi').value > 0) { st.dpi = +$('#dpi').value; outUI(); } };
$('#fmt').onclick = e => {
  const f = e.target.dataset.f; if (!f) return;
  st.fmt = f; document.querySelectorAll('#fmt button').forEach(b => b.classList.toggle('on', b === e.target));
  $('#mapsec').hidden = f !== 'map'; outUI(); draw(false);   // the stage shows the map while it's the chosen output
};
$('#unit').onchange = e => { st.unit = e.target.value; files(); info(); outUI(); };
$('#seed').onclick = () => { st.seed = Math.floor(Math.random() * 10000); $('#seedn').textContent = st.seed; draw(false); };
$('#bg').oninput = e => { st.bg = e.target.value; draw(true); };
$('#bg').onchange = () => draw(false);
$('#bg').value = st.bg; $('#dpi').value = st.dpi; $('#seedn').textContent = st.seed;

// ---- render: one request in flight; sliders drag at half resolution, then sharpen on release
const body = () => JSON.stringify({
  p: {...P, ...st.map, seed: st.seed, bg: st.bg, w: st.w, h: st.h, dpi: st.dpi, pv: st.pv,
      pts: strokes.flat().map(([x, y]) => [+x.toFixed(4), +y.toFixed(4)])},
  sources: st.files.map(f => ({id: f.id, w: f.w, page: f.page - 1})),
  map: st.fmt === 'map', lines: $('#lines').checked});
let busy = false, again = null;
async function draw(fast) {
  if (!st.files.length) return;
  if (busy) { again = again === false ? false : fast; return; }
  busy = true;
  try {
    const k = Math.min(($('#stage').clientWidth - 72) / st.w, ($('#stage').clientHeight - 72) / st.h), v = $('#view'), fr = $('#frame');
    fr.style.width = st.w * k + 'px'; fr.style.height = st.h * k + 'px'; inkRedraw();
    st.pv = Math.round(Math.min(2400, Math.max(300, Math.max(st.w, st.h) * k * devicePixelRatio * (fast ? .5 : 1))));
    const r = await fetch('/preview', {method: 'POST', body: body()});
    if (r.ok) {
      const old = v.src; v.src = URL.createObjectURL(await r.blob());
      if (old.startsWith('blob:')) URL.revokeObjectURL(old);
      $('#ms').textContent = r.headers.get('X-Ms') + ' ms';
    } else toast((await r.json()).error);
  } catch (e) { toast(String(e)); }
  busy = false;
  if (again !== null) { const f = again; again = null; draw(f); }
}
let rs; addEventListener('resize', () => { clearTimeout(rs); rs = setTimeout(() => draw(false), 120); });

$('#go').onclick = async () => {
  if (!st.files.length) return toast('add an image or pdf first');
  const b = $('#go'); b.disabled = true; b.textContent = 'rendering…';
  try {
    const r = await fetch('/export/' + st.fmt, {method: 'POST', body: body()});
    if (!r.ok) throw new Error((await r.json()).error);
    const a = document.createElement('a'); a.href = URL.createObjectURL(await r.blob()); a.download = r.headers.get('X-Name') || 'collage.' + st.fmt; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 6e4);
  } catch (e) { toast(e.message); }
  b.disabled = false; outUI();
};
// ---- random files from a folder: replaces the previous random pick, keeps files you added yourself
$('#fgo').onclick = async () => {
  const b = $('#fgo'); b.disabled = true;
  try {
    const r = await fetch('/folder', {method: 'POST', body: JSON.stringify({path: $('#fpath').value, n: +$('#fn').value || 1})});
    const j = await r.json(); if (!r.ok) throw new Error(j.error);
    st.files.filter(f => f.folder).forEach(f => fetch('/source/' + f.id, {method: 'DELETE'}));
    st.files = st.files.filter(f => !f.folder).concat(j.sources.map(s => ({...s, page: 1, edited: false, folder: true})));
    after(); toast(`picked ${j.sources.length} of ${j.total} files` + (j.skipped ? `, ${j.skipped} unreadable` : ''));
  } catch (e) { toast(e.message); }
  b.disabled = false;
};

// ---- drawings: freehand strokes over the preview (kept as 0..1 of the canvas); sections drift toward them
const ink = $('#ink'), strokes = [];
function inkRedraw() {
  const r = ink.getBoundingClientRect(), d = devicePixelRatio;
  ink.width = Math.round(r.width * d); ink.height = Math.round(r.height * d);   // resizing clears the canvas
  const g = ink.getContext('2d'); g.lineWidth = 2 * d; g.lineCap = g.lineJoin = 'round'; g.strokeStyle = '#ff5a36';
  for (const s of strokes) { g.beginPath(); s.forEach(([x, y], i) => g[i ? 'lineTo' : 'moveTo'](x * ink.width, y * ink.height)); g.stroke(); }
}
let cur = null;
const at = e => { const r = ink.getBoundingClientRect(); return [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height].map(v => Math.min(1, Math.max(0, v))); };
ink.onpointerdown = e => { ink.setPointerCapture(e.pointerId); const p = at(e); cur = [p, p]; strokes.push(cur); inkRedraw(); };
ink.onpointermove = e => {
  if (!cur) return;
  const [x, y] = at(e), [px, py] = cur[cur.length - 1], n = Math.ceil(Math.hypot(x - px, y - py) / .01);   // a point every 1% so fast strokes stay dense
  for (let i = 1; i <= n; i++) cur.push([px + (x - px) * i / n, py + (y - py) * i / n]);
  inkRedraw();
};
ink.onpointerup = ink.onpointercancel = () => { if (cur) { cur = null; draw(false); } };
$('#inkbtn').onclick = e => { e.target.classList.toggle('on'); ink.classList.toggle('on', e.target.classList.contains('on')); };
$('#inkclear').onclick = () => { strokes.length = 0; inkRedraw(); draw(false); };

// ---- tone curve: drag points; a monotone cubic through them becomes the 256-entry table sent with every render
const cv = $('#curve'), cx = cv.getContext('2d');
let cpts = [[0, 0], [1, 1]], drag = -1;
function curveFn(pts) {   // Fritsch-Carlson monotone cubic: never overshoots between points
  const n = pts.length, d = [], m = [];
  for (let i = 0; i < n - 1; i++) d.push((pts[i + 1][1] - pts[i][1]) / (pts[i + 1][0] - pts[i][0]));
  m[0] = d[0]; m[n - 1] = d[n - 2];
  for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2;
  for (let i = 0; i < n - 1; i++) {
    if (d[i] === 0) { m[i] = m[i + 1] = 0; continue; }
    const a = m[i] / d[i], b = m[i + 1] / d[i], s = a * a + b * b;
    if (s > 9) { const t = 3 / Math.sqrt(s); m[i] = t * a * d[i]; m[i + 1] = t * b * d[i]; }
  }
  return x => {
    let i = 0; while (i < n - 2 && x > pts[i + 1][0]) i++;
    const h = pts[i + 1][0] - pts[i][0], t = (x - pts[i][0]) / h, t2 = t * t, t3 = t2 * t;
    return Math.min(1, Math.max(0, (2 * t3 - 3 * t2 + 1) * pts[i][1] + (t3 - 2 * t2 + t) * h * m[i] + (-2 * t3 + 3 * t2) * pts[i + 1][1] + (t3 - t2) * h * m[i + 1]));
  };
}
function curveSet(fast) {
  const f = curveFn(cpts), s = cv.width, css = getComputedStyle(document.documentElement);
  P.curve = Array.from({length: 256}, (_, v) => Math.round(f(v / 255) * 255));
  cx.clearRect(0, 0, s, s); cx.lineWidth = 1; cx.strokeStyle = css.getPropertyValue('--line');
  for (let i = 1; i < 4; i++) { cx.beginPath(); cx.moveTo(i * s / 4, 0); cx.lineTo(i * s / 4, s); cx.moveTo(0, i * s / 4); cx.lineTo(s, i * s / 4); cx.stroke(); }
  cx.lineWidth = 3; cx.strokeStyle = cx.fillStyle = css.getPropertyValue('--fg').trim();
  cx.beginPath(); P.curve.forEach((y, v) => cx[v ? 'lineTo' : 'moveTo'](v / 255 * s, (1 - y / 255) * s)); cx.stroke();
  cpts.forEach(([x, y]) => { cx.beginPath(); cx.arc(x * s, (1 - y) * s, 8, 0, 7); cx.fill(); });
  draw(fast);
}
function curveMove(i, x, y) {   // interior points stay between their neighbours; the ends only slide up and down
  const last = cpts.length - 1;
  cpts[i] = [i === 0 ? 0 : i === last ? 1 : Math.min(cpts[i + 1][0] - .01, Math.max(cpts[i - 1][0] + .01, x)), Math.min(1, Math.max(0, y))];
  curveSet(true);
}
const cat = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width, 1 - (e.clientY - r.top) / r.height]; };
cv.onpointerdown = e => {
  cv.setPointerCapture(e.pointerId);
  const [x, y] = cat(e);
  drag = cpts.findIndex(([px, py]) => Math.hypot(px - x, py - y) < .06);
  if (drag < 0 && x > .01 && x < .99) { const np = [x, y]; cpts.push(np); cpts.sort((a, b) => a[0] - b[0]); drag = cpts.indexOf(np); }
  if (drag >= 0) curveMove(drag, x, y);
};
cv.onpointermove = e => { if (drag >= 0) curveMove(drag, ...cat(e)); };
cv.onpointerup = () => { if (drag >= 0) { drag = -1; draw(false); } };
cv.ondblclick = e => {
  const [x, y] = cat(e), i = cpts.findIndex(([px, py], k) => k > 0 && k < cpts.length - 1 && Math.hypot(px - x, py - y) < .06);
  if (i > 0) { cpts.splice(i, 1); curveSet(false); }
};
$('#curvereset').onclick = () => { cpts = [[0, 0], [1, 1]]; curveSet(false); };

// ---- migration map controls
for (const [id, v] of Object.entries(st.map)) {
  const el = $('#' + id), fill = () => el.type === 'range' && el.style.setProperty('--p', el.value * 100 + '%');
  el.value = v; fill();
  el.oninput = () => { st.map[id] = el.type === 'range' ? +el.value : el.value; fill(); draw(true); };
  el.onchange = () => draw(false);
}

info(); outUI(); curveSet(false);
</script>
</body>
